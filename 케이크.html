<script>
const cake=document.getElementById('cake'), img=cake.querySelector('img');
const BPM=220, BEATS_PER_BAR=3, OFFSET=0.02, ANGLE=4;
const BAR=60/BPM*BEATS_PER_BAR;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC();
let buffer=null, playing=false, raf=0, lastBar=-1, t0=0;

const bin=atob(document.getElementById('aud').textContent.trim());
const bytes=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
const ready=new Promise((res,rej)=>ctx.decodeAudioData(bytes.buffer,res,rej)).then(b=>buffer=b);

function tick(){
  const t=ctx.currentTime-t0-OFFSET;
  // 마디 첫 박에서 좌/우 끝에 닿도록 부드럽게 왕복 (2마디 = 1왕복)
  const env = Math.min(1, Math.max(0, t/(BAR*0.5)));
  const a = -ANGLE*env*Math.cos(Math.PI*Math.max(0,t)/BAR);
  img.style.transform=`rotate(${a}deg)`;
  raf=requestAnimationFrame(tick);
}
function done(){ playing=false; document.body.classList.remove('playing'); cancelAnimationFrame(raf); lastBar=-1; img.style.transform=''; }

cake.addEventListener('click',async()=>{
  if(playing) return;
  playing=true; document.body.classList.add('playing');
  try{
    const r=ctx.resume();
    await ready; await r;
    const src=ctx.createBufferSource();
    src.buffer=buffer; src.connect(ctx.destination);
    src.onended=done;
    t0=ctx.currentTime+0.03;
    src.start(t0);
    if(!still) raf=requestAnimationFrame(tick);
  }catch(e){ done(); }
});
</script>
